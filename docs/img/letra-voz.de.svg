<svg xmlns="http://www.w3.org/2000/svg" xml:lang="de" width="680" height="310" viewBox="0 0 680 310" role="img" aria-labelledby="titulo desc">
<title id="titulo">Wo ein Vers landet, den Whisper nicht gehört hat</title>
<desc id="desc">Eine Zeitleiste von 24 Sekunden. YAMNet erkennt Gesang von 0 bis 12 s und von 20 bis 24 s; von 12 bis 20 s gibt es eine Instrumentalpassage. Whisper hörte die Verse 1, 2 und 4, aber nicht Vers 3. Vorher wurde Vers 3 an Vers 4 angehängt und landete in der Instrumentalpassage, von 16 bis 20 s. Jetzt zählt nur die Zeit mit Gesang, und er landet bei 8 bis 12 s, wo er gesungen wird.</desc>
<style>
