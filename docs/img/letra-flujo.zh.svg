<path class="flecha" d="M520 316 V342 H400 V368" marker-end="url(#punta)"/>
<path class="flecha" d="M200 316 V342 H280 V368" marker-end="url(#punta)"/>
<path class="flecha" d="M100 316 V368" marker-end="url(#punta)"/>
<path class="flecha" d="M190 398 H218" marker-end="url(#punta)"/>
<path class="flecha" d="M340 426 V478" marker-end="url(#punta)"/>
<g class="verde" data-caja="">
<rect x="240" y="150" width="200" height="56" rx="8"/>
<text class="t" x="340" y="169" text-anchor="middle" dominant-baseline="central">Whisper Turbo</text>
<text class="s" x="340" y="189" text-anchor="middle" dominant-baseline="central">听到什么、何时听到</text>
</g>
<g class="verde" data-caja="">
<rect x="460" y="150" width="160" height="56" rx="8"/>
<text class="t" x="540" y="169" text-anchor="middle" dominant-baseline="central">Demucs</text>
<text class="s" x="540" y="189" text-anchor="middle" dominant-baseline="central">只留人声</text>
</g>
<g class="verde" data-caja="">
<rect x="40" y="260" width="240" height="56" rx="8"/>
<text class="t" x="160" y="279" text-anchor="middle" dominant-baseline="central">逐字对照</text>
<text class="s" x="160" y="299" text-anchor="middle" dominant-baseline="central">每句所在的范围</text>
</g>
<g class="verde" data-caja="">
<rect x="400" y="260" width="240" height="56" rx="8"/>
<text class="t" x="520" y="279" text-anchor="middle" dominant-baseline="central">narabas</text>
<text class="s" x="520" y="299" text-anchor="middle" dominant-baseline="central">每个音素从哪里开始</text>
</g>
<g class="coral" data-caja="">
<rect x="20" y="370" width="170" height="56" rx="8"/>
<text class="t" x="105" y="389" text-anchor="middle" dominant-baseline="central">Claude</text>
<text class="s" x="105" y="409" text-anchor="middle" dominant-baseline="central">几乎对不上时</text>
</g>
<g class="verde" data-caja="">
<rect x="220" y="370" width="240" height="56" rx="8"/>
<text class="t" x="340" y="389" text-anchor="middle" dominant-baseline="central">letra.ts 计算时间</text>
<text class="s" x="340" y="409" text-anchor="middle" dominant-baseline="central">固定规则，不用 AI</text>
</g>
<g class="gris" data-caja="">
<rect x="240" y="480" width="200" height="56" rx="8"/>
<text class="t" x="340" y="499" text-anchor="middle" dominant-baseline="central">歌词字幕轨</text>
<text class="s" x="340" y="519" text-anchor="middle" dominant-baseline="central">分析并翻译</text>
</g>
<g data-leyenda=""><g class="verde"><rect x="217" y="560" width="12" height="12" rx="3"/></g><text class="e" x="237" y="566" dominant-baseline="central">在浏览器中</text></g>
<g data-leyenda=""><g class="coral"><rect x="337" y="560" width="12" height="12" rx="3"/></g><text class="e" x="357" y="566" dominant-baseline="central">Claude，通过 API</text></g>
</svg>
